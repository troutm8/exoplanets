<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NASA Exoplanet Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0a0e1a;
    color: #e0e6f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stars-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 20% 50%, #0d1528 0%, #0a0e1a 60%),
                radial-gradient(ellipse at 80% 20%, #111a30 0%, transparent 50%);
    z-index: 0;
  }

  .stars-bg::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 50% 30%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.9), transparent),
      radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1.5px 1.5px at 45% 50%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 65% 90%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 85% 40%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 25% 15%, rgba(255,255,255,0.4), transparent);
    animation: twinkle 8s ease-in-out infinite alternate;
  }

  @keyframes twinkle { 0% { opacity: 0.7; } 100% { opacity: 1; } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  @keyframes orbit { from { transform: rotate(0deg) translateX(var(--orbit-r)) rotate(0deg); } to { transform: rotate(360deg) translateX(var(--orbit-r)) rotate(-360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glow { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }

  .container {
    position: relative; z-index: 1;
    max-width: 1400px; margin: 0 auto; padding: 20px;
  }

  header {
    text-align: center; padding: 30px 0 20px;
    animation: fadeIn 1s ease-out;
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.2em; font-weight: 900;
    background: linear-gradient(135deg, #4fc3f7, #7c4dff, #e040fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 3px;
  }

  header p { color: #7a8baa; margin-top: 8px; font-size: 0.95em; }

  .search-section {
    display: flex; justify-content: center; align-items: center;
    gap: 15px; margin: 25px 0; flex-wrap: wrap;
  }

  .search-container {
    position: relative; width: 450px;
  }

  .search-container input {
    width: 100%; padding: 14px 20px 14px 45px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; color: #e0e6f0; font-size: 1em;
    font-family: 'Inter', sans-serif; outline: none;
    transition: all 0.3s;
  }

  .search-container input:focus {
    border-color: #4fc3f7; background: rgba(255,255,255,0.08);
    box-shadow: 0 0 20px rgba(79,195,247,0.15);
  }

  .search-container .search-icon {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    color: #5a6a8a; font-size: 1.1em;
  }

  .dropdown {
    position: absolute; top: 100%; left: 0; width: 100%;
    background: #141b2d; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; max-height: 350px; overflow-y: auto;
    z-index: 100; display: none; margin-top: 5px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .dropdown.open { display: block; }

  .dropdown-item {
    padding: 12px 18px; cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.2s;
  }

  .dropdown-item:hover { background: rgba(79,195,247,0.1); }
  .dropdown-item .planet-name { font-weight: 600; color: #e0e6f0; }
  .dropdown-item .planet-meta { font-size: 0.8em; color: #5a6a8a; margin-top: 2px; }

  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  .filter-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); color: #7a8baa; cursor: pointer;
    font-size: 0.82em; font-family: 'Inter', sans-serif;
    transition: all 0.3s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: #4fc3f7; color: #4fc3f7; background: rgba(79,195,247,0.1);
  }

  .main-display {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 25px; margin-top: 25px;
    animation: fadeIn 0.8s ease-out;
  }

  @media (max-width: 900px) { .main-display { grid-template-columns: 1fr; } }

  .panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px; padding: 25px;
    backdrop-filter: blur(10px);
  }

  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85em; color: #4fc3f7;
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 18px;
  }

  .viz-canvas {
    width: 100%; height: 380px;
    border-radius: 12px;
    background: radial-gradient(circle at center, #0f1525 0%, #080c16 100%);
    position: relative; overflow: hidden;
  }

  .viz-canvas canvas { width: 100%; height: 100%; }

  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 14px;
  }

  .stat-card .label {
    font-size: 0.72em; color: #5a6a8a;
    text-transform: uppercase; letter-spacing: 1px;
  }

  .stat-card .value {
    font-size: 1.25em; font-weight: 700; color: #e0e6f0;
    margin-top: 4px;
  }

  .stat-card .unit { font-size: 0.7em; color: #5a6a8a; font-weight: 400; }

  .comparison-section { margin-top: 25px; }

  .size-compare {
    display: flex; align-items: flex-end;
    justify-content: center; gap: 30px;
    height: 180px; padding: 20px 0;
  }

  .compare-body { text-align: center; }

  .compare-circle {
    border-radius: 50%; margin: 0 auto 8px;
    transition: all 0.5s ease;
  }

  .compare-label { font-size: 0.75em; color: #7a8baa; }
  .compare-size { font-size: 0.65em; color: #5a6a8a; }

  .hz-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 0.82em; font-weight: 600;
  }

  .hz-badge.yes {
    background: rgba(76,175,80,0.15); color: #66bb6a;
    border: 1px solid rgba(76,175,80,0.3);
  }

  .hz-badge.no {
    background: rgba(244,67,54,0.1); color: #ef5350;
    border: 1px solid rgba(244,67,54,0.2);
  }

  .orbital-info {
    margin-top: 20px; padding: 15px;
    background: rgba(255,255,255,0.02); border-radius: 10px;
  }

  .orbital-info h4 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75em; color: #7c4dff;
    letter-spacing: 2px; margin-bottom: 12px;
  }

  .orbit-bar {
    height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.06);
    margin: 8px 0; position: relative;
    overflow: hidden;
  }

  .orbit-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #4fc3f7, #7c4dff);
    transition: width 0.8s ease;
  }

  .orbit-label {
    display: flex; justify-content: space-between;
    font-size: 0.75em; color: #5a6a8a;
  }

  .welcome-msg {
    grid-column: 1 / -1;
    text-align: center; padding: 80px 20px;
    color: #5a6a8a;
  }

  .welcome-msg h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5em; color: #3a4a6a; margin-bottom: 15px;
  }

  .planet-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex-wrap: wrap; gap: 10px;
  }

  .planet-name-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.4em; font-weight: 700;
    background: linear-gradient(135deg, #e0e6f0, #4fc3f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .discovery-tag {
    padding: 4px 12px; border-radius: 15px;
    font-size: 0.75em; font-weight: 500;
    background: rgba(124,77,255,0.15); color: #b388ff;
    border: 1px solid rgba(124,77,255,0.3);
  }

  .star-info {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 0 15px; color: #7a8baa; font-size: 0.9em;
  }

  .star-dot {
    width: 10px; height: 10px; border-radius: 50%;
    animation: glow 3s ease-in-out infinite;
  }

  .bottom-panels {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 25px; margin-top: 25px;
  }

  @media (max-width: 900px) { .bottom-panels { grid-template-columns: 1fr; } }

  .random-btn {
    padding: 10px 22px; border-radius: 10px;
    border: 1px solid rgba(124,77,255,0.3);
    background: rgba(124,77,255,0.1); color: #b388ff;
    cursor: pointer; font-family: 'Inter', sans-serif;
    font-size: 0.9em; font-weight: 500;
    transition: all 0.3s;
  }

  .random-btn:hover {
    background: rgba(124,77,255,0.2);
    box-shadow: 0 0 20px rgba(124,77,255,0.2);
  }

  .counter {
    text-align: center; margin-top: 5px;
    font-size: 0.8em; color: #3a4a6a;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
</style>
</head>
<body>

<div class="stars-bg"></div>

<div class="container">
  <header>
    <h1>EXOPLANET EXPLORER</h1>
    <p>Interactive visualization of <span id="totalCount">6,150</span> confirmed exoplanets from the NASA Exoplanet Archive</p>
  </header>

  <div class="search-section">
    <div class="search-container">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="Search for an exoplanet..." autocomplete="off">
      <div class="dropdown" id="dropdown"></div>
    </div>
    <button class="random-btn" id="randomBtn">&#x1F3B2; Random Planet</button>
  </div>

  <div class="filter-btns">
    <button class="filter-btn" data-filter="all">All Planets</button>
    <button class="filter-btn" data-filter="hz">Habitable Zone</button>
    <button class="filter-btn" data-filter="hot-jupiter">Hot Jupiters</button>
    <button class="filter-btn" data-filter="super-earth">Super-Earths</button>
    <button class="filter-btn" data-filter="earth-like">Earth-like</button>
    <button class="filter-btn" data-filter="giant">Gas Giants</button>
  </div>

  <div class="main-display" id="mainDisplay">
    <div class="welcome-msg" id="welcomeMsg">
      <h2>SELECT A PLANET TO EXPLORE</h2>
      <p>Search by name, filter by type, or hit Random to discover a new world</p>
    </div>
  </div>
</div>

// Parse data
const FIELDS = ['name','star','method','year','period','distance','mass','radius','temp','sma','starTemp','starRadius','ra','dec','hz','constellation'];
const planets = RAW.map(r => {
  const p = {};
  FIELDS.forEach((f, i) => p[f] = r[i]);
  return p;
});

let filtered = planets;
let selected = null;

// Star color from temperature
function starColor(temp) {
  if (!temp) return '#fff5e0';
  if (temp > 10000) return '#aabfff';
  if (temp > 7500) return '#cad8ff';
  if (temp > 6000) return '#fff4e8';
  if (temp > 5000) return '#ffd2a1';
  if (temp > 3500) return '#ffb56c';
  return '#ff8833';
}

// Planet color from equilibrium temp and mass
function planetColors(p) {
  const t = p.temp;
  const m = p.mass;
  const r = p.radius;

  // Ice worlds
  if (t && t < 200) return { base: '#a8c8e8', accent: '#d4e8f8', type: 'ice' };
  // Hot worlds
  if (t && t > 1500) return { base: '#e84040', accent: '#ff8844', type: 'lava' };
  // Gas giants
  if (m && m > 0.5) {
    if (t && t > 1000) return { base: '#cc6633', accent: '#e8994c', type: 'hot-gas' };
    return { base: '#c8a060', accent: '#e8cc8a', type: 'gas' };
  }
  // Rocky / super-earth
  if (r && r < 0.2) {
    if (p.hz === 'Yes') return { base: '#4488bb', accent: '#66bb88', type: 'habitable' };
    return { base: '#8b7355', accent: '#a0906a', type: 'rocky' };
  }
  // Neptune-like
  if (m && m > 0.03 && m < 0.5) return { base: '#4477aa', accent: '#66aadd', type: 'neptune' };
  // Habitable
  if (p.hz === 'Yes') return { base: '#3388aa', accent: '#55bb77', type: 'habitable' };
  // Default
  return { base: '#7a8899', accent: '#aabbcc', type: 'unknown' };
}

// Draw planet visualization on canvas
function drawPlanet(canvas, planet) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const bgGrad = ctx.createRadialGradient(W*0.35, H*0.4, 0, W*0.5, H*0.5, W*0.6);
  bgGrad.addColorStop(0, '#0f1525');
  bgGrad.addColorStop(1, '#080c16');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Small background stars
  const rng = mulberry32(hashStr(planet.name));
  for (let i = 0; i < 80; i++) {
    const sx = rng() * W, sy = rng() * H;
    const sr = rng() * 1.2 + 0.3;
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${rng()*0.5+0.2})`;
    ctx.fill();
  }

  const sc = starColor(planet.starTemp);
  const pc = planetColors(planet);

  // Draw host star (top-left, partially off-screen)
  const starX = W * 0.12;
  const starY = H * 0.15;
  const starR = 35 + (planet.starRadius || 1) * 12;

  // Star glow
  const sg = ctx.createRadialGradient(starX, starY, 0, starX, starY, starR * 3);
  sg.addColorStop(0, sc);
  sg.addColorStop(0.3, sc + '66');
  sg.addColorStop(1, 'transparent');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W * 0.5, H * 0.5);

  ctx.beginPath();
  ctx.arc(starX, starY, starR, 0, Math.PI*2);
  const starGrad = ctx.createRadialGradient(starX-starR*0.2, starY-starR*0.2, 0, starX, starY, starR);
  starGrad.addColorStop(0, '#ffffff');
  starGrad.addColorStop(0.3, sc);
  starGrad.addColorStop(1, darkenColor(sc, 0.6));
  ctx.fillStyle = starGrad;
  ctx.fill();

  // Planet
  const pX = W * 0.58;
  const pY = H * 0.52;
  const baseR = 60;
  const pr = planet.radius ? Math.min(Math.max(baseR * Math.pow(planet.radius / 1.0, 0.4), 25), 120) : baseR;

  // Planet shadow (from star)
  ctx.save();
  ctx.beginPath();
  ctx.arc(pX, pY, pr + 2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.filter = 'blur(8px)';
  ctx.fill();
  ctx.restore();

  // Planet body
  ctx.beginPath();
  ctx.arc(pX, pY, pr, 0, Math.PI*2);
  const pGrad = ctx.createRadialGradient(pX - pr*0.3, pY - pr*0.3, 0, pX, pY, pr);

  if (pc.type === 'habitable') {
    pGrad.addColorStop(0, '#55aacc');
    pGrad.addColorStop(0.4, '#3388aa');
    pGrad.addColorStop(0.7, '#337755');
    pGrad.addColorStop(1, '#1a3322');
  } else if (pc.type === 'gas' || pc.type === 'hot-gas') {
    pGrad.addColorStop(0, lightenColor(pc.base, 1.4));
    pGrad.addColorStop(0.5, pc.base);
    pGrad.addColorStop(1, darkenColor(pc.base, 0.4));
  } else if (pc.type === 'lava') {
    pGrad.addColorStop(0, '#ff6644');
    pGrad.addColorStop(0.5, '#cc3322');
    pGrad.addColorStop(1, '#661111');
  } else if (pc.type === 'ice') {
    pGrad.addColorStop(0, '#e8f4ff');
    pGrad.addColorStop(0.5, '#a8c8e8');
    pGrad.addColorStop(1, '#5577aa');
  } else {
    pGrad.addColorStop(0, lightenColor(pc.base, 1.3));
    pGrad.addColorStop(0.6, pc.base);
    pGrad.addColorStop(1, darkenColor(pc.base, 0.4));
  }
  ctx.fillStyle = pGrad;
  ctx.fill();

  // Surface texture (bands for gas giants, craters for rocky)
  ctx.save();
  ctx.beginPath();
  ctx.arc(pX, pY, pr, 0, Math.PI*2);
  ctx.clip();

  if (pc.type === 'gas' || pc.type === 'hot-gas' || pc.type === 'neptune') {
    // Atmospheric bands
    for (let i = 0; i < 8; i++) {
      const by = pY - pr + (i * pr * 2 / 8) + rng() * 8;
      const bh = 3 + rng() * 6;
      ctx.fillStyle = `rgba(${rng()>0.5?'255,255,255':'0,0,0'},${0.03 + rng()*0.07})`;
      ctx.beginPath();
      ctx.ellipse(pX, by, pr * 1.1, bh, 0.05 * rng(), 0, Math.PI*2);
      ctx.fill();
    }
    // Storm spot
    if (planet.mass > 1) {
      const spotX = pX + (rng()-0.5) * pr * 0.6;
      const spotY = pY + (rng()-0.5) * pr * 0.4;
      ctx.beginPath();
      ctx.ellipse(spotX, spotY, pr*0.15, pr*0.1, rng()*0.5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,120,80,0.3)`;
      ctx.fill();
    }
  } else if (pc.type === 'habitable') {
    // Continents
    for (let i = 0; i < 4; i++) {
      const cx = pX + (rng()-0.5) * pr * 1.2;
      const cy = pY + (rng()-0.5) * pr * 0.8;
      ctx.beginPath();
      ctx.ellipse(cx, cy, pr*0.2+rng()*pr*0.15, pr*0.12+rng()*pr*0.1, rng()*Math.PI, 0, Math.PI*2);
      ctx.fillStyle = `rgba(60,140,70,${0.25+rng()*0.2})`;
      ctx.fill();
    }
    // Cloud wisps
    for (let i = 0; i < 3; i++) {
      const cx = pX + (rng()-0.5) * pr * 1.4;
      const cy = pY + (rng()-0.5) * pr * 0.6;
      ctx.beginPath();
      ctx.ellipse(cx, cy, pr*0.25, pr*0.04, rng()*0.8, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.1+rng()*0.12})`;
      ctx.fill();
    }
  } else if (pc.type === 'rocky') {
    // Craters
    for (let i = 0; i < 12; i++) {
      const cx = pX + (rng()-0.5) * pr * 1.6;
      const cy = pY + (rng()-0.5) * pr * 1.6;
      const cr = 2 + rng() * 8;
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,0,0,${0.1+rng()*0.12})`;
      ctx.fill();
    }
  } else if (pc.type === 'lava') {
    // Lava cracks
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      let lx = pX + (rng()-0.5)*pr*1.2;
      let ly = pY + (rng()-0.5)*pr*1.2;
      ctx.moveTo(lx, ly);
      for (let j = 0; j < 4; j++) {
        lx += (rng()-0.5)*20; ly += (rng()-0.5)*20;
        ctx.lineTo(lx, ly);
      }
      ctx.strokeStyle = `rgba(255,120,20,${0.2+rng()*0.3})`;
      ctx.lineWidth = 1+rng()*2;
      ctx.stroke();
    }
  } else if (pc.type === 'ice') {
    // Ice fractures
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      let lx = pX + (rng()-0.5)*pr*1.4;
      let ly = pY + (rng()-0.5)*pr*1.4;
      ctx.moveTo(lx, ly);
      for (let j = 0; j < 3; j++) {
        lx += (rng()-0.5)*25; ly += (rng()-0.5)*25;
        ctx.lineTo(lx, ly);
      }
      ctx.strokeStyle = `rgba(200,220,255,${0.1+rng()*0.15})`;
      ctx.lineWidth = 0.5+rng();
      ctx.stroke();
    }
  }
  ctx.restore();

  // Atmosphere rim
  ctx.beginPath();
  ctx.arc(pX, pY, pr, 0, Math.PI*2);
  const rimGrad = ctx.createRadialGradient(pX, pY, pr*0.85, pX, pY, pr*1.02);
  rimGrad.addColorStop(0, 'transparent');
  rimGrad.addColorStop(0.7, pc.type === 'habitable' ? 'rgba(100,180,255,0.15)' : `rgba(255,255,255,0.06)`);
  rimGrad.addColorStop(1, pc.type === 'habitable' ? 'rgba(80,160,255,0.25)' : `rgba(255,255,255,0.12)`);
  ctx.fillStyle = rimGrad;
  ctx.fill();

  // Terminator (day/night line) shadow
  ctx.beginPath();
  ctx.arc(pX, pY, pr, 0, Math.PI*2);
  const shadow = ctx.createLinearGradient(pX-pr, pY, pX+pr, pY);
  shadow.addColorStop(0, 'transparent');
  shadow.addColorStop(0.55, 'transparent');
  shadow.addColorStop(0.85, 'rgba(0,0,0,0.35)');
  shadow.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = shadow;
  ctx.fill();

  // Star light reflection
  ctx.beginPath();
  ctx.arc(pX - pr*0.25, pY - pr*0.25, pr*0.15, 0, Math.PI*2);
  const hl = ctx.createRadialGradient(pX-pr*0.25, pY-pr*0.25, 0, pX-pr*0.25, pY-pr*0.25, pr*0.3);
  hl.addColorStop(0, 'rgba(255,255,255,0.18)');
  hl.addColorStop(1, 'transparent');
  ctx.fillStyle = hl;
  ctx.fill();

  // Labels
  ctx.font = '600 13px Inter, sans-serif';
  ctx.fillStyle = sc;
  ctx.textAlign = 'center';
  ctx.fillText(planet.star || 'Unknown Star', starX, starY + starR + 18);

  ctx.font = '300 10px Inter, sans-serif';
  ctx.fillStyle = '#5a6a8a';
  if (planet.starTemp) {
    ctx.fillText(Math.round(planet.starTemp) + ' K', starX, starY + starR + 33);
  }

  // Planet type label at bottom
  const typeLabels = {
    'gas': 'Gas Giant', 'hot-gas': 'Hot Gas Giant', 'neptune': 'Neptune-like',
    'rocky': 'Rocky World', 'habitable': 'Potentially Habitable', 'lava': 'Lava World',
    'ice': 'Ice World', 'unknown': 'Exoplanet'
  };
  ctx.font = '500 11px Inter, sans-serif';
  ctx.fillStyle = pc.accent;
  ctx.textAlign = 'center';
  ctx.fillText(typeLabels[pc.type] || 'Exoplanet', pX, H - 15);
}

// Utility functions
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < (s||'').length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return h;
}

function darkenColor(hex, factor) {
  const rgb = hexToRgb(hex);
  return `rgb(${Math.round(rgb.r*factor)},${Math.round(rgb.g*factor)},${Math.round(rgb.b*factor)})`;
}

function lightenColor(hex, factor) {
  const rgb = hexToRgb(hex);
  return `rgb(${Math.min(255,Math.round(rgb.r*factor))},${Math.min(255,Math.round(rgb.g*factor))},${Math.min(255,Math.round(rgb.b*factor))})`;
}

function hexToRgb(hex) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return {
    r: parseInt(hex.substring(0,2),16),
    g: parseInt(hex.substring(2,4),16),
    b: parseInt(hex.substring(4,6),16)
  };
}

function fmt(val, decimals=2) {
  if (val === null || val === undefined) return 'Unknown';
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  if (Math.abs(n) > 10000) return n.toLocaleString('en-US', {maximumFractionDigits: 0});
  return n.toFixed(decimals);
}

// Display selected planet
function showPlanet(p) {
  selected = p;
  const main = document.getElementById('mainDisplay');

  // Earth & Jupiter reference values (in Jupiter units)
  const earthRadiusJup = 0.0892;
  const earthMassJup = 0.00315;

  const pc = planetColors(p);
  const sc = starColor(p.starTemp);

  // Calculate comparison sizes
  const pRadiusEarth = p.radius ? (p.radius / earthRadiusJup) : null;
  const pMassEarth = p.mass ? (p.mass / earthMassJup) : null;

  // Size comparison circles (max 100px)
  const maxPx = 90;
  const jupPx = maxPx;
  const earthPx = earthRadiusJup * maxPx;
  const planetPx = p.radius ? Math.min(Math.max(p.radius * maxPx, 4), maxPx * 2.5) : 30;

  // Orbital period bar (log scale, max at 100000 days)
  const periodPct = p.period ? Math.min(Math.log10(Math.max(p.period, 0.1)) / Math.log10(100000) * 100, 100) : 0;
  // SMA bar (log scale vs Earth = 1 AU, max at 100 AU)
  const smaPct = p.sma ? Math.min(Math.log10(Math.max(p.sma, 0.001)) / Math.log10(100) * 100 + 50, 100) : 0;
  // Distance bar (log scale, max at 10000 pc)
  const distPct = p.distance ? Math.min(Math.log10(Math.max(p.distance, 1)) / Math.log10(10000) * 100, 100) : 0;

  main.innerHTML = `
    <div class="panel" style="animation: fadeIn 0.5s ease-out">
      <div class="planet-header">
        <span class="planet-name-display">${p.name}</span>
        <span class="discovery-tag">${p.method || 'Unknown'} &bull; ${p.year ? Math.round(p.year) : '?'}</span>
      </div>
      <div class="star-info">
        <span class="star-dot" style="background:${sc}; box-shadow: 0 0 8px ${sc}"></span>
        Host star: <strong>${p.star || 'Unknown'}</strong>
        ${p.constellation ? `&nbsp;&bull;&nbsp; ${p.constellation}` : ''}
      </div>
      <div class="viz-canvas">
        <canvas id="planetCanvas" width="700" height="380"></canvas>
      </div>
      <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px">
        <span class="hz-badge ${p.hz === 'Yes' ? 'yes' : 'no'}">
          ${p.hz === 'Yes' ? '&#x2705; Habitable Zone' : '&#x274C; Not in Habitable Zone'}
        </span>
        ${p.ra ? `<span style="font-size:0.75em;color:#5a6a8a">RA: ${p.ra} &nbsp; Dec: ${p.dec}</span>` : ''}
      </div>
    </div>

    <div class="panel" style="animation: fadeIn 0.6s ease-out">
      <div class="panel-title">Planetary Data</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="label">Mass</div>
          <div class="value">${p.mass ? fmt(p.mass, 4) : '?'} <span class="unit">M<sub>J</sub></span></div>
          ${pMassEarth ? `<div style="font-size:0.72em;color:#5a6a8a;margin-top:2px">${fmt(pMassEarth, 1)} Earth masses</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Radius</div>
          <div class="value">${p.radius ? fmt(p.radius, 3) : '?'} <span class="unit">R<sub>J</sub></span></div>
          ${pRadiusEarth ? `<div style="font-size:0.72em;color:#5a6a8a;margin-top:2px">${fmt(pRadiusEarth, 1)} Earth radii</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Orbital Period</div>
          <div class="value">${p.period ? fmt(p.period, 2) : '?'} <span class="unit">days</span></div>
          ${p.period ? `<div style="font-size:0.72em;color:#5a6a8a;margin-top:2px">${fmt(p.period/365.25, 2)} years</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Eq. Temperature</div>
          <div class="value">${p.temp ? fmt(p.temp, 0) : '?'} <span class="unit">K</span></div>
          ${p.temp ? `<div style="font-size:0.72em;color:#5a6a8a;margin-top:2px">${fmt(p.temp - 273.15, 0)} &deg;C</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Semi-major Axis</div>
          <div class="value">${p.sma ? fmt(p.sma, 4) : '?'} <span class="unit">AU</span></div>
        </div>
        <div class="stat-card">
          <div class="label">Distance</div>
          <div class="value">${p.distance ? fmt(p.distance, 1) : '?'} <span class="unit">pc</span></div>
          ${p.distance ? `<div style="font-size:0.72em;color:#5a6a8a;margin-top:2px">${fmt(p.distance * 3.2616, 1)} light-years</div>` : ''}
        </div>
        <div class="stat-card">
          <div class="label">Stellar Temp</div>
          <div class="value">${p.starTemp ? fmt(p.starTemp, 0) : '?'} <span class="unit">K</span></div>
        </div>
        <div class="stat-card">
          <div class="label">Stellar Radius</div>
          <div class="value">${p.starRadius ? fmt(p.starRadius, 2) : '?'} <span class="unit">R<sub>&#x2609;</sub></span></div>
        </div>
      </div>

      <div class="orbital-info">
        <h4>Orbital Context</h4>
        <div class="orbit-label"><span>Orbital Period</span><span>${p.period ? fmt(p.period,1) + ' days' : '?'}</span></div>
        <div class="orbit-bar"><div class="orbit-bar-fill" style="width:${periodPct}%"></div></div>
        <div class="orbit-label"><span>Distance from Star</span><span>${p.sma ? fmt(p.sma,3) + ' AU' : '?'}</span></div>
        <div class="orbit-bar"><div class="orbit-bar-fill" style="width:${smaPct}%; background: linear-gradient(90deg, #66bb6a, #ffb74d)"></div></div>
        <div class="orbit-label"><span>Distance from Earth</span><span>${p.distance ? fmt(p.distance,0) + ' pc' : '?'}</span></div>
        <div class="orbit-bar"><div class="orbit-bar-fill" style="width:${distPct}%; background: linear-gradient(90deg, #e040fb, #7c4dff)"></div></div>
      </div>
    </div>

    <div class="panel comparison-section" style="grid-column: 1 / -1; animation: fadeIn 0.7s ease-out">
      <div class="panel-title">Size Comparison</div>
      <div class="size-compare">
        <div class="compare-body">
          <div class="compare-circle" style="width:${earthPx}px;height:${earthPx}px;background:radial-gradient(circle at 35% 35%, #6ba4d4, #2d5f8a, #1a3550);min-width:6px;min-height:6px"></div>
          <div class="compare-label">Earth</div>
          <div class="compare-size">1.0 R<sub>&#x2295;</sub></div>
        </div>
        <div class="compare-body">
          <div class="compare-circle" style="width:${planetPx}px;height:${planetPx}px;background:radial-gradient(circle at 35% 35%, ${lightenColor(pc.base, 1.3)}, ${pc.base}, ${darkenColor(pc.base, 0.5)})"></div>
          <div class="compare-label" style="color:#4fc3f7">${p.name}</div>
          <div class="compare-size">${pRadiusEarth ? fmt(pRadiusEarth,1) + ' R&#x2295;' : '?'}</div>
        </div>
        <div class="compare-body">
          <div class="compare-circle" style="width:${jupPx}px;height:${jupPx}px;background:radial-gradient(circle at 35% 35%, #e8cc8a, #c8a060, #6b5530)"></div>
          <div class="compare-label">Jupiter</div>
          <div class="compare-size">11.2 R<sub>&#x2295;</sub></div>
        </div>
      </div>
    </div>
  `;

  // Draw the canvas
  const canvas = document.getElementById('planetCanvas');
  if (canvas) drawPlanet(canvas, p);
}

function lightenColor(hex, factor) {
  const rgb = hexToRgb(hex);
  return `rgb(${Math.min(255,Math.round(rgb.r*factor))},${Math.min(255,Math.round(rgb.g*factor))},${Math.min(255,Math.round(rgb.b*factor))})`;
}

// Search functionality
const searchInput = document.getElementById('searchInput');
const dropdown = document.getElementById('dropdown');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (q.length < 2) { dropdown.classList.remove('open'); return; }

  const matches = filtered.filter(p =>
    (p.name && p.name.toLowerCase().includes(q)) ||
    (p.star && p.star.toLowerCase().includes(q)) ||
    (p.constellation && p.constellation.toLowerCase().includes(q))
  ).slice(0, 30);

  if (matches.length === 0) {
    dropdown.innerHTML = '<div class="dropdown-item"><span class="planet-meta">No matches found</span></div>';
  } else {
    dropdown.innerHTML = matches.map(p => `
      <div class="dropdown-item" data-name="${p.name}">
        <div class="planet-name">${p.name}</div>
        <div class="planet-meta">${p.star || ''} &bull; ${p.method || ''} &bull; ${p.year ? Math.round(p.year) : ''} ${p.hz==='Yes' ? '&bull; &#x1F30D; Habitable Zone' : ''}</div>
      </div>
    `).join('');
  }
  dropdown.classList.add('open');
});

dropdown.addEventListener('click', (e) => {
  const item = e.target.closest('.dropdown-item');
  if (!item) return;
  const name = item.dataset.name;
  const planet = planets.find(p => p.name === name);
  if (planet) {
    searchInput.value = planet.name;
    dropdown.classList.remove('open');
    showPlanet(planet);
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-container')) dropdown.classList.remove('open');
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const f = btn.dataset.filter;
    const earthRadJup = 0.0892;
    const earthMassJup = 0.00315;

    switch(f) {
      case 'all': filtered = planets; break;
      case 'hz': filtered = planets.filter(p => p.hz === 'Yes'); break;
      case 'hot-jupiter': filtered = planets.filter(p => p.mass > 0.3 && p.period && p.period < 10); break;
      case 'super-earth': filtered = planets.filter(p => p.mass && p.mass > earthMassJup && p.mass < earthMassJup * 10 && p.radius && p.radius < earthRadJup * 2.5); break;
      case 'earth-like': filtered = planets.filter(p => p.radius && p.radius > earthRadJup*0.5 && p.radius < earthRadJup*1.6 && p.hz === 'Yes'); break;
      case 'giant': filtered = planets.filter(p => p.mass && p.mass > 1); break;
    }

    // Show a random planet from the filtered set
    if (filtered.length > 0) {
      const rp = filtered[Math.floor(Math.random() * filtered.length)];
      searchInput.value = rp.name;
      showPlanet(rp);
    }
  });
});

// Random button
document.getElementById('randomBtn').addEventListener('click', () => {
  const rp = filtered[Math.floor(Math.random() * filtered.length)];
  searchInput.value = rp.name;
  showPlanet(rp);
});

// Show a famous planet on load
const famous = planets.find(p => p.name && p.name.includes('Kepler-442 b')) ||
               planets.find(p => p.hz === 'Yes') ||
               planets[0];
if (famous) {
  searchInput.value = famous.name;
  showPlanet(famous);
}
</script>
